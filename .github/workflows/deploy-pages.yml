name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Sync fresh reading data
        run: npm run sync:reading
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
      - run: npm run check
      - run: npm test
      - name: Build and check links
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
